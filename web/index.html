    <script type="module">
      const XKM_STATE_DB = "drama-app-state-db";
      const XKM_STATE_DB_VERSION = 1;
      const XKM_STATE_STORE = "state-snapshots";
      const XKM_META_STORE = "metadata";
      const XKM_PRIMARY_KEY = "primary";
      const XKM_META_KEY = "primary-state";

      const xkmLocalStoreUrl = (path) =>
        window.location.protocol === "file:"
          ? `http://127.0.0.1:8022${path}`
          : path;

      const xkmOpenStateDb = () =>
        new Promise((resolve, reject) => {
          const request = indexedDB.open(XKM_STATE_DB, XKM_STATE_DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(XKM_STATE_STORE)) {
              db.createObjectStore(XKM_STATE_STORE, { keyPath: "key" });
            }
            if (!db.objectStoreNames.contains(XKM_META_STORE)) {
              db.createObjectStore(XKM_META_STORE, { keyPath: "key" });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });

      const xkmGetPrimarySnapshot = (db) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction(XKM_STATE_STORE, "readonly");
          const request = tx.objectStore(XKM_STATE_STORE).get(XKM_PRIMARY_KEY);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
          tx.onerror = () => reject(tx.error);
        });

      const xkmWriteDiskSnapshot = async (snapshot) => {
        if (!snapshot || !snapshot.state) return;
        const db = await xkmOpenStateDb();
        try {
          const current = await xkmGetPrimarySnapshot(db).catch(() => null);
          if (
            current &&
            Number(current.saveRevision || 0) > Number(snapshot.saveRevision || 0)
          ) {
            return;
          }
          await new Promise((resolve, reject) => {
            const tx = db.transaction([XKM_STATE_STORE, XKM_META_STORE], "readwrite");
            const meta = {
              key: XKM_META_KEY,
              value: {
                primaryStore: "disk",
                cacheStore: "indexeddb",
                lastSaveRevision: Number(snapshot.saveRevision || 0),
                lastSavedAt: snapshot.updatedAt || new Date().toISOString(),
                migratedAt: new Date().toISOString()
              }
            };
            tx.objectStore(XKM_STATE_STORE).put(snapshot);
            tx.objectStore(XKM_META_STORE).put(meta);
            tx.oncomplete = () => {
              try {
                localStorage.setItem(
                  "drama-app-state-meta-v1",
                  JSON.stringify(meta.value)
                );
              } catch {}
              resolve();
            };
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error);
          });
        } finally {
          db.close();
        }
      };

      const xkmRestoreFromDiskBeforeBoot = async () => {
        if (!("indexedDB" in window)) return;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1500);
        try {
          const response = await fetch(xkmLocalStoreUrl("/api/local-store/state"), {
            cache: "no-store",
            signal: controller.signal
          });
          if (!response.ok) return;
          await xkmWriteDiskSnapshot(await response.json());
        } catch {
        } finally {
          clearTimeout(timeout);
        }
      };

      await xkmRestoreFromDiskBeforeBoot();
      await import("./assets/index-DZb1o-TM.js");
      await import("./xkm-project-runtime.js?v=20260521i");
    </script>
